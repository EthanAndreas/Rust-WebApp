[package]
name = "RustWebapp-frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.20", features = ["csr"] }
gloo-net = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"  # Ajouté
web-sys = { version = "0.3", features = ["HtmlInputElement"] }
gloo-storage = "0.2"