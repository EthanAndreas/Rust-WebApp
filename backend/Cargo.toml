[package]
name = "RustWebapp-backend"
version = "1.0.0"
edition = "2021"

[dependencies]
actix-web = "4.3"
actix-session = { version = "0.7", features = ["cookie-session"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.6", features = ["runtime-actix-rustls", "postgres", "chrono", "uuid"] }
tera = "1.17"
env_logger = "0.9"
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3", features = ["v4", "serde"] }
bcrypt = "0.10"
actix-cors = "0.6"